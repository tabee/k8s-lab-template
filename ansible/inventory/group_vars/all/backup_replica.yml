---
# Issue #3: off-host replica of the rustfs backup data. The ONE place for host, user and limits.
# The primary stays rustfs on the owner's PC (backup_s3.yml). The replica is a plain directory on
# another machine of the home LAN; nothing runs as root there. Runbook: docs/how-to/backup-replica.md.
# The role backup_replica deliberately has no defaults/.

# false: lab.sh replica says so and does nothing, the alert check "replica" is skipped.
backup_replica_enabled: false

# ---------- The replica machine (the only place for these values) ----------
backup_replica_host: replica-pc.home
backup_replica_user: replica-user
backup_replica_port: 22
# The LAN the PC connects from; goes into authorized_keys as from="...".
backup_replica_from_cidr: 192.0.2.0/24
# Pinned ssh host key of the replica (type and key only, e.g. "ssh-ed25519 AAAA...").
# Empty = every ssh command aborts with the way to fetch it (lab.sh replica hostkey).
backup_replica_host_key: ""
# rrsync of the rsync package (Ubuntu 24.04), locks the key into the directory below.
backup_replica_rrsync: /usr/bin/rrsync
# Directory on the replica, relative to its home (or absolute). rrsync locks the key into it.
backup_replica_remote_dir: k8s-lab-replica

# ---------- Keys on the owner's PC ----------
# Personal key: used ONCE, to install the restricted key (shell access to the replica).
backup_replica_install_key: "{{ backup_s3_home }}/.ssh/id_ed25519"
# Dedicated key of the mirror. Generated by lab.sh init / replica install (secrets map: replica-ssh-key).
backup_replica_key: "{{ backup_s3_home }}/.ssh/k8s-lab-replica"
backup_replica_known_hosts: "{{ backup_s3_home }}/.config/k8s-lab/replica_known_hosts"
backup_replica_config: "{{ backup_s3_home }}/.config/k8s-lab/replica.json"

# ---------- What is mirrored, and how ----------
# Source: the data dir of rustfs (both buckets and the rustfs metadata with the users and policies).
backup_replica_source: "{{ backup_s3_data_dir }}"
# Never copied: temporary upload parts of rustfs (relative to the data dir).
backup_replica_exclude:
  - .rustfs.sys/tmp
# false: the replica key may not delete (rrsync -no-del) and the mirror never deletes. The replica only grows;
# a ransomware on the PC cannot wipe it. true: the mirror follows deletions (retention of barman/K8up).
backup_replica_allow_delete: false
backup_replica_script: "{{ backup_s3_script_dir }}/lab-replica.py"

# ---------- Cadence and limits ----------
backup_replica_mirror_interval_min: 15
backup_replica_mirror_boot_delay_min: 5
# Daily checksum run (systemd calendar).
backup_replica_verify_calendar: "*-*-* 04:30:00"
# The mirror is "fresh" while the last successful run is not older than this (the replica PC may sleep).
backup_replica_max_age_min: 180
backup_replica_connect_timeout: 10
backup_replica_io_timeout: 300
# Free space on the replica at install: max(data x factor, min_free_mib).
backup_replica_min_free_factor: 1.2
backup_replica_min_free_mib: 512
backup_replica_unit_prefix: lab-replica
