---
# WireGuard tunnel between the production node and the control PC (issue #60).
# Default OFF: the lab VM on libvirt does not need it. Production turns it on
# (wireguard_enabled: true in the prod inventory) once keys exist.
# Concrete tunnel addresses and the listen port come from lab.yaml / the prod inventory;
# this file must not embed a fixed tunnel network (public export denylist).
# Runbook: docs/how-to/wireguard-tunnel.md. Keys never in git (lab-secrets + files on disk).

wireguard_enabled: false
wireguard_interface: wg0
# UDP listen port on the node (0 = do not listen; client mode still works).
wireguard_listen_port: "{{ lab.wireguard_port | default(0) }}"
# Address of THIS host inside the tunnel. Empty here; the prod inventory sets them.
wireguard_address_server: ""
wireguard_address_client: ""
# AllowedIPs on each side (empty here; prod inventory sets them from lab.vm_cidr / lab.gateway).
wireguard_allowed_ips_on_server: ""
wireguard_allowed_ips_on_client: ""
# PersistentKeepalive from the client (NAT); 0 = off.
wireguard_keepalive: 25
# MTU for the tunnel interface.
wireguard_mtu: 1420
# Private key files on the control PC (generated by lab-secrets, mode 600). Public part is sibling .pub.
wireguard_server_key_path: "{{ backup_s3_home }}/.config/k8s-lab/wireguard-server.key"
wireguard_client_key_path: "{{ backup_s3_home }}/.config/k8s-lab/wireguard-client.key"
# Public endpoint the client dials (node public IP + listen port). Empty until the server exists.
wireguard_endpoint: ""
