---
# ONE list of all secrets (files on the control machine). Only paths and
# descriptions, never a value. Read by:
#   scripts/lab.sh init / secrets   (via scripts/lab-secrets.py)
#   docs/reference/secrets-map.md                 (a test checks that every name is listed there)
# Paths come from the role variables (each path is defined only there).
# Each entry starts with "- name:" on one line (the docs test reads it that way).
#
# kind:
#   age        age key (age-keygen)
#   break-glass optional offline key (lab.sh init --break-glass), never in the cluster
#   ca         lab CA as secret YAML (keys ca.crt, tls.crt, tls.key)
#   pw         random password of letters and digits (length)
#   text       fixed string (content)
#   rustfs     root key of rustfs (rustfs.env)
#   s3env      S3 access as env file (s3_user, s3_bucket, s3_endpoint)
#   ssh        ed25519 key pair (comment)
#   cluster    exists only in the cluster, no file (read-only)
#   derived    created during the build (up), not generated by init
#   external   you create it yourself (optional), init never generates it
# password_manager: true = loss means data loss, back it up outside the machine.
# copy: command that puts the value on the clipboard (optional, otherwise wl-copy < path).

secrets_fixed:
  - name: age-key
    purpose: SOPS/KSOPS key, decrypts all secrets/*.sops.yaml (Argo CD gets it as secret argocd/sops-age)
    kind: age
    path: "{{ argocd_sops_age_key_path | expanduser }}"
    created_by: lab.sh init (age-keygen)
    consumers: .sops.yaml (recipients), sops, Argo CD repo-server (KSOPS)
    rotation: new key as second recipient, sops updatekeys, remove the old one (docs/how-to/secrets.md)
    password_manager: true

  # Optional (issue 11): second, OFFLINE age recipient. Created only by
  # `lab.sh init --break-glass`, shown by the card, never read by any playbook.
  # The file is meant to be deleted after it is in the password manager.
  - name: break-glass-key
    purpose: Optional offline age recipient (private part). Put it in the password manager, then delete the file. Never in the cluster.
    kind: break-glass
    path: "{{ argocd_sops_break_glass_key_path | expanduser }}"
    copy: "wl-copy < {{ argocd_sops_break_glass_key_path }}   (then: bash scripts/lab.sh init --break-glass-delete)"
    created_by: lab.sh init --break-glass (age-keygen, private part is never printed)
    consumers: .sops.yaml (last recipient), sops updatekeys; restore on a new machine without the online key
    rotation: new key pair, add it as last recipient, sops updatekeys, remove the old recipient
    password_manager: true

  - name: lab-ca
    purpose: Lab CA (cert-manager signs the service certificates with it), secret YAML with ca.crt, tls.crt, tls.key
    kind: ca
    path: "{{ lab_ca_secret_file }}"
    ca_name: "{{ lab_ca_secret_name }}"
    ca_namespace: "{{ lab_ca_namespace }}"
    ca_cn: "{{ lab.domain }} Lab CA"
    # The CA may only sign names under this domain (critical nameConstraints).
    ca_domain: "{{ lab.domain }}"
    public_path: "{{ lab_ca_cert_path | expanduser }}"
    created_by: lab.sh init (openssl)
    consumers: secrets/cert-manager/lab-ca.sops.yaml, ClusterIssuer, role lab_ca
    rotation: lab.sh ca-rotation (backs up the old CA, builds the new one with nameConstraints, SOPS anew), procedure in docs/how-to/ca-rotation.md
    password_manager: true

  - name: acme-token
    purpose: API token of the DNS provider for the certificates of the public probe domain (DNS-01, only if lab.local.yaml sets acme_*), one line
    kind: external
    path: "{{ lab_acme_token_file | expanduser }}"
    created_by: you yourself (only if you use the public probe); otherwise lab.sh init creates a SOPS file with an empty value
    consumers: secrets/cert-manager/acme-dns01-token.sops.yaml, ClusterIssuer lab-acme (role lab_acme)
    rotation: renew the token at the DNS provider, replace the file, delete the SOPS file and run lab.sh init (renders anew), commit
    password_manager: false

  - name: rustfs-root
    purpose: Root key of the S3 server rustfs on the control machine
    kind: rustfs
    path: "{{ backup_s3_root_env }}"
    created_by: lab.sh init, or Ansible backup-host.yml (role backup_s3), whichever runs first
    consumers: rustfs (quadlet), role backup_s3 (creates bucket users)
    rotation: replace the file, restart rustfs, register the bucket users anew (backup-host.yml)

  - name: s3-cnpg
    purpose: S3 access of the database backups (bucket cnpg-k3s-lab only)
    kind: s3env
    path: "{{ backup_s3_user_env }}"
    s3_user: "{{ backup_s3_user }}"
    s3_bucket: "{{ backup_s3_bucket }}"
    s3_endpoint: "{{ backup_s3_vm_endpoint }}"
    created_by: lab.sh init, or Ansible backup-host.yml (role backup_s3)
    consumers: >-
      secrets/db-lab/backup-s3-creds.sops.yaml, secrets/gitea/backup-s3-creds.sops.yaml, secrets/matrix/backup-s3-creds.sops.yaml,
      secrets/keycloak/backup-s3-creds.sops.yaml, rustfs (user)
    rotation: replace the file, backup-host.yml (register the user anew), render the SOPS files anew

  - name: s3-k8up
    purpose: S3 access of the K8up backups (bucket k8up-k3s-lab only)
    kind: s3env
    path: "{{ backup_s3_k8up_user_env }}"
    s3_user: "{{ backup_s3_k8up_user }}"
    s3_bucket: "{{ backup_s3_k8up_bucket }}"
    s3_endpoint: "{{ backup_s3_vm_endpoint }}"
    created_by: lab.sh init, or Ansible backup-host.yml (role backup_s3)
    consumers: secrets/gitea/k8up-s3-creds.sops.yaml, secrets/matrix/k8up-s3-creds.sops.yaml, rustfs (user)
    rotation: replace the file, backup-host.yml (register the user anew), render the SOPS file anew

  - name: gitea-db-pw
    purpose: Password of the Gitea database user
    kind: pw
    path: "{{ gitea_db_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/gitea/gitea-db-owner.sops.yaml (Namespace gitea)
    rotation: replace the file, render the SOPS file anew, set the password in the database

  - name: gitea-admin-user
    purpose: User name of the Gitea admin
    kind: text
    path: "{{ gitea_admin_user_file }}"
    content: lab-admin
    created_by: lab.sh init (default lab-admin, the file can be changed freely afterwards)
    consumers: secrets/gitea/gitea-admin.sops.yaml (namespace gitea)
    rotation: change the file, render the SOPS file anew

  - name: gitea-admin-pw
    purpose: Password of the Gitea admin
    kind: pw
    path: "{{ gitea_admin_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/gitea/gitea-admin.sops.yaml (namespace gitea)
    rotation: replace the file, render the SOPS file anew

  - name: gitea-runner-token
    purpose: Global registration token of the Gitea Actions runner (Gitea creates it at start, the runner registers with it)
    kind: pw
    path: "{{ gitea_runner_token_file }}"
    length: 48
    created_by: lab.sh init
    consumers: secrets/gitea/gitea-runner-token.sops.yaml (namespace gitea), secrets/gitea-runner/gitea-runner-registration.sops.yaml (namespace gitea-runner)
    rotation: reset it in Gitea, replace the file, render both SOPS files anew, restart Gitea and the runner (docs/how-to/gitea-actions.md)

  - name: k8up-repo-pw
    purpose: Password of the restic repo (encrypts all K8up backups, without it the backups are unreadable)
    kind: pw
    path: "{{ gitea_k8up_repo_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/gitea/k8up-repo.sops.yaml (namespace gitea), secrets/matrix/k8up-repo.sops.yaml (namespace matrix, own restic prefix)
    rotation: not without a new restic repo (old backups stay readable with the old password)
    password_manager: true

  - name: matrix-db-pw
    purpose: Password of the Matrix database user
    kind: pw
    path: "{{ matrix_db_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/matrix/matrix-db-owner.sops.yaml (namespace matrix)
    rotation: replace the file, render the SOPS file anew, set the password in the database

  - name: matrix-admin-user
    purpose: User name of the Matrix admin
    kind: text
    path: "{{ matrix_admin_user_file }}"
    content: lab-admin
    created_by: lab.sh init (default lab-admin, the file can be changed freely afterwards)
    consumers: secrets/matrix/matrix-admin.sops.yaml (namespace matrix)
    rotation: change the file, render the SOPS file anew

  - name: matrix-admin-pw
    purpose: Password of the Matrix admin
    kind: pw
    path: "{{ matrix_admin_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/matrix/matrix-admin.sops.yaml (namespace matrix)
    rotation: replace the file, render the SOPS file anew

  - name: matrix-registration-secret
    purpose: Shared secret with which Synapse creates the admin (registration itself stays off)
    kind: pw
    path: "{{ matrix_registration_secret_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/matrix/matrix-registration.sops.yaml (namespace matrix)
    rotation: replace the file, render the SOPS file anew (existing admin is not recreated)
    password_manager: true

  - name: matrix-signing-key
    purpose: Optional Synapse signing key (one line). Empty means the first start generates it on the volume and K8up backs it up
    kind: external
    path: "{{ matrix_signing_key_file }}"
    created_by: you, or the first Synapse start when the file is absent (docs/how-to/matrix.md)
    consumers: secrets/matrix/matrix-signing-key.sops.yaml (namespace matrix)
    rotation: not without a new homeserver identity; a different key than the one on the volume makes the pod stop
    password_manager: true

  - name: keycloak-db-pw
    purpose: Password of the Keycloak database user
    kind: pw
    path: "{{ keycloak_db_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/keycloak/keycloak-db-owner.sops.yaml (namespace keycloak)
    rotation: replace the file, render the SOPS file anew, set the password in the database

  - name: keycloak-admin-user
    purpose: User name of the Keycloak bootstrap admin (realm master, port-forward only)
    kind: text
    path: "{{ keycloak_admin_user_file }}"
    content: kc-admin
    created_by: lab.sh init (default kc-admin, the file can be changed freely afterwards)
    consumers: secrets/keycloak/keycloak-admin.sops.yaml (namespace keycloak)
    rotation: change the file, render the SOPS file anew (an existing admin is not renamed, only used for the first start)

  - name: keycloak-admin-pw
    purpose: Password of the Keycloak bootstrap admin, also used by the realm job
    kind: pw
    path: "{{ keycloak_admin_password_file }}"
    length: 32
    created_by: lab.sh init
    consumers: secrets/keycloak/keycloak-admin.sops.yaml (namespace keycloak)
    rotation: replace the file, render the SOPS file anew, then set the new password in the admin console (the bootstrap value only counts for the first start)

  - name: keycloak-gitea-client-secret
    purpose: OIDC client secret of the Keycloak client gitea (the same value on both sides)
    kind: pw
    path: "{{ keycloak_gitea_client_secret_file }}"
    length: 48
    created_by: lab.sh init
    consumers: secrets/keycloak/keycloak-oidc-clients.sops.yaml (namespace keycloak), secrets/gitea/gitea-oidc.sops.yaml (namespace gitea)
    rotation: replace the file, render both SOPS files anew; the realm job and Gitea pick it up on the next sync

  - name: keycloak-synapse-client-secret
    purpose: OIDC client secret of the Keycloak client synapse (the same value on both sides)
    kind: pw
    path: "{{ keycloak_synapse_client_secret_file }}"
    length: 48
    created_by: lab.sh init
    consumers: secrets/keycloak/keycloak-oidc-clients.sops.yaml (namespace keycloak), secrets/matrix/matrix-oidc.sops.yaml (namespace matrix)
    rotation: replace the file, render both SOPS files anew; the realm job and Synapse pick it up on the next sync

  - name: keycloak-notes-client-secret
    purpose: OIDC client secret of the Keycloak client notes (one client for all notes sites with auth sso)
    kind: pw
    path: "{{ keycloak_notes_client_secret_file }}"
    length: 48
    created_by: lab.sh init
    consumers: >-
      secrets/keycloak/keycloak-notes-client.sops.yaml (namespace keycloak, realm job),
      Secret notes-oidc in every sso notes namespace (Ansible argocd.yml, role notes_sites)
    rotation: >-
      replace the file, render the SOPS file anew, push, run argocd.yml;
      the realm job sets the new secret, the login proxies pick it up with the new Secret (restart)

  - name: argocd-deploy-key
    purpose: Private SSH key with which Argo CD reads the Git repo (register read-only)
    kind: ssh
    path: "{{ argocd_repo_ssh_key_path | expanduser }}"
    comment: "argocd-k8s-lab (read-only)"
    created_by: lab.sh init (ssh-keygen ed25519)
    consumers: Secret argocd/{{ argocd_repo_secret_name }} (Ansible argocd.yml), Deploy-Key im Git-Server
    rotation: new pair, enter the .pub in the Git server as a read-only deploy key, run argocd.yml

  - name: replica-ssh-key
    purpose: Restricted SSH key of the backup replica mirror (rsync only, locked into one directory by rrsync, from the LAN only)
    kind: ssh
    path: "{{ backup_replica_key | expanduser }}"
    comment: "k8s-lab-replica"
    created_by: lab.sh init (ssh-keygen ed25519) or lab.sh replica install
    consumers: lab-replica.py (systemd user timers on this PC), authorized_keys of the replica (public part, restrict + from= + rrsync)
    rotation: delete the key pair, lab.sh replica install (new pair, replaces the line in authorized_keys), then lab.sh replica verify

  - name: replica-install-key
    purpose: Your personal SSH key; used only once to install the restricted replica key (shell access to the replica)
    kind: external
    path: "{{ backup_replica_install_key | expanduser }}"
    created_by: you (your normal ssh key, not created or changed by the lab)
    consumers: ansible/backup-replica.yml (install step only)
    rotation: not a lab secret; after the install nothing needs it

  - name: alert-matrix-token
    purpose: Access token of the Matrix bot user for alerts (SOPS file, only used when the Matrix sink is switched on)
    kind: external
    path: "{{ alert_matrix_token_file | expanduser }}"
    created_by: you, once Synapse exists (docs/how-to/alerts.md), then sops encrypts it
    consumers: lab-alert.py (sink matrix, decrypts it with sops at send time)
    rotation: new token for the bot user in Synapse, sops encrypt the new file, old token logout

  - name: alert-heartbeat-url
    purpose: External heartbeat ping URL (healthchecks.io-compatible) and optional fail URL; SOPS file
    kind: external
    path: "{{ alert_heartbeat_url_file | expanduser }}"
    created_by: you (create the check at the provider, write ping_url / fail_url, sops encrypt; docs/how-to/alerts.md)
    consumers: lab-alert.py (decrypts at ping time with sops)
    rotation: new check UUID at the provider, sops encrypt the new file, delete the old check

  - name: wireguard-server-key
    purpose: WireGuard private key of the production node (server peer); public part is not secret
    kind: wireguard
    path: "{{ wireguard_server_key_path | expanduser }}"
    created_by: lab-secrets.py generate (wg genkey) via the wireguard playbook (secrets-generate.yml)
    consumers: ansible role wireguard on the k3s node (reads private key, never logs it)
    rotation: new key pair, update peer public key on the control PC, re-run the wireguard role on both sides

  - name: wireguard-client-key
    purpose: WireGuard private key of the control PC (client peer); public part is not secret
    kind: wireguard
    path: "{{ wireguard_client_key_path | expanduser }}"
    created_by: lab-secrets.py generate (wg genkey) via the wireguard playbook (secrets-generate.yml)
    consumers: ansible role wireguard on the backup_host (reads private key, never logs it)
    rotation: new key pair, update peer public key on the node, re-run the wireguard role on both sides

  - name: vm-ssh-key
    purpose: SSH key for access to the lab VM (Ansible, lab.sh)
    kind: ssh
    path: "{{ lab.ssh_key | expanduser }}"
    comment: "k8s-lab VM access"
    created_by: lab.sh init (ssh-keygen ed25519)
    consumers: cloud-init of the VM (public part), Ansible inventory
    rotation: new pair, rebuild the VM (rebuild)

  - name: argocd-admin
    purpose: Initial admin password of Argo CD (exists only in the cluster, not on the machine)
    kind: cluster
    copy: >-
      kubectl --kubeconfig {{ argocd_kubeconfig }} -n {{ argocd_namespace }}
      get secret argocd-initial-admin-secret -o jsonpath='{.data.password}'
      | base64 -d | wl-copy
    created_by: Argo CD (Helm chart, at first start)
    consumers: Argo web UI
    rotation: change the password in Argo CD, afterwards the initial secret is invalid

  - name: kubeconfig
    purpose: Access to the cluster (created during the build)
    kind: derived
    path: "{{ argocd_kubeconfig }}"
    created_by: Ansible site.yml (role k3s, during up)
    consumers: kubectl, Ansible argocd.yml and more
    rotation: is created anew on rebuild

# Only with a separate private secrets repo (secrets_repo_url != repo_url, ADR 0022).
secrets_secrets_repo:
  - name: argocd-secrets-deploy-key
    purpose: Private SSH key with which Argo CD reads the private secrets repo (register read-only)
    kind: ssh
    path: "{{ argocd_secrets_repo_ssh_key_path | expanduser }}"
    comment: "argocd-k8s-lab-secrets (read-only)"
    created_by: lab.sh init (ssh-keygen ed25519)
    consumers: Secret argocd/{{ argocd_secrets_repo_secret_name }} (Ansible argocd.yml), deploy key of the secrets repo
    rotation: new pair, enter the .pub in the secrets repo as a read-only deploy key, run argocd.yml

# Per notes site (gitops/sites.yaml) one deploy key and, depending on auth, a password (basic)
# or a cookie key (sso, default).
secrets_notes: |-
  {%- set result = [] -%}
  {%- for s in (lookup('ansible.builtin.file', notes_sites_file) | from_yaml | default([], true)) -%}
  {%- set ns = notes_namespace_prefix ~ s.name -%}
  {%- set _ = result.append({
    'name': ns ~ '-deploy',
    'purpose': 'Deploy key of the notes site ' ~ s.name ~ ' (register read-only in the Git server)',
    'kind': 'ssh',
    'path': (notes_deploy_key_dir | expanduser) ~ '/' ~ ns ~ '-deploy',
    'comment': ns ~ '-deploy (k8s-lab, read-only)',
    'created_by': 'lab.sh init, or Ansible argocd.yml (role notes_sites)',
    'consumers': 'Secret ' ~ ns ~ '/' ~ notes_repo_secret_name ~ ' (Ansible argocd.yml, Rolle notes_sites), Deploy-Key im Git-Server',
    'rotation': 'new pair, enter the .pub in the Git server, run argocd.yml'
  }) -%}
  {%- if (s.auth | default(notes_auth_default)) == 'basic' -%}
  {%- set _ = result.append({
    'name': ns ~ '-pw',
    'purpose': 'Password of the notes site ' ~ s.name ~ ' (auth basic)',
    'kind': 'pw',
    'path': (notes_password_dir | expanduser) ~ '/' ~ ns ~ '.passwort',
    'length': notes_password_length,
    'created_by': 'lab.sh init, or Ansible argocd.yml (role notes_sites)',
    'consumers': 'Secret ' ~ ns ~ '/' ~ notes_auth_secret_name ~ ' (Ansible argocd.yml, role notes_sites)',
    'rotation': 'replace the file, run argocd.yml'
  }) -%}
  {%- else -%}
  {%- set _ = result.append({
    'name': ns ~ '-cookie',
    'purpose': 'Session cookie key of the login proxy of the notes site ' ~ s.name ~ ' (auth sso)',
    'kind': 'pw',
    'path': (notes_cookie_dir | expanduser) ~ '/' ~ ns ~ '.cookie',
    'length': notes_cookie_length,
    'created_by': 'lab.sh init, or Ansible argocd.yml (role notes_sites)',
    'consumers': 'Secret ' ~ ns ~ '/' ~ notes_oidc_secret_name ~ ' (Ansible argocd.yml, role notes_sites)',
    'rotation': 'replace the file, run argocd.yml; all sessions of the site end (new login)'
  }) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ result | to_json }}

# Location of the lab CA as secret YAML (next to the public certificate).
lab_ca_secret_file: "{{ lab_ca_cert_path | expanduser | dirname }}/lab-ca-secret.yaml"

# The single generator of all secret files (lab.sh init and the roles
# backup_s3 and notes_sites, via ansible/tasks/secrets-generate.yml).
lab_secrets_script: "{{ playbook_dir }}/../scripts/lab-secrets.py"

# Everything lab.sh and lab-secrets.py need (one variable, one call).
secrets_all:
  entries: >-
    {{ secrets_fixed + (secrets_secrets_repo if argocd_secrets_repo_separate | bool else [])
       + (secrets_notes if secrets_notes is not string else secrets_notes | from_json)
       + (secrets_prod | default([])) }}
