# Ansible configuration for the k3s lab.
# Applies only if ansible-* is started from this directory.
# Attention: in a world-writable directory Ansible ignores this file.

[defaults]
# Default inventory: local VM. Choose another environment with -i.
inventory = inventory/local.yml
# Other environments (inventory/<env>.yml) are chosen with -i or ANSIBLE_INVENTORY and must never merge into
# "-i inventory" (a directory), which would add their hosts to the lab's groups.
inventory_ignore_patterns = ^prod\.yml$
roles_path = roles
# Find Python on the target automatically, without warning.
interpreter_python = auto_silent
# More readable output of task results.
callback_result_format = yaml
# No *.retry files in the repo.
retry_files_enabled = False
forks = 10
timeout = 30
# host_key_checking deliberately stays active (default).

[privilege_escalation]
# become is set per play, not globally.
become = False

[ssh_connection]
# Fewer SSH round trips; works because sudo does not require requiretty.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
