---
# Remove the empty file PVC from the new disk, whatever state it is in.
# 1. No pod may mount it (recover-quiesce-one.yml names the pod if one does).
# 2. A PVC that is already Terminating (an earlier attempt, or a pod that has
#    just gone) must vanish first.
# 3. Delete it and wait.
- name: Scale the workload to zero and make sure no pod mounts the PVC
  ansible.builtin.include_tasks: recover-quiesce-one.yml

- name: Wait until a PVC that is already Terminating is gone
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ target.namespace }}"
    name: "{{ target.claim }}"
  register: recover_pvc_state
  retries: "{{ recover_pod_retries | default(36) }}"
  delay: "{{ recover_poll | default(5) }}"
  until: >-
    recover_pvc_state.resources | default([])
    | selectattr('metadata.deletionTimestamp', 'defined') | list | length == 0
  ignore_errors: true

- name: Say why the PVC does not go away
  when: recover_pvc_state is failed
  ansible.builtin.fail:
    msg: >-
      {{ target.namespace }}/{{ target.claim }} stays in Terminating although
      no pod mounts it. Look at the finalizers: kubectl -n {{ target.namespace }}
      get pvc {{ target.claim }} -o jsonpath='{.metadata.finalizers}'

- name: Delete the file PVC from the new disk
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ target.namespace }}"
    name: "{{ target.claim }}"
    wait: true
    wait_timeout: 180
