---
# Creates missing secret files. Called from roles with
#   ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/secrets-generate.yml"
#   vars: { secret_names: [rustfs-root, s3-cnpg] }
# secret_names are names from group_vars/all/secrets.yml (only the list
# there knows paths and formats). Generated solely by scripts/lab-secrets.py
# (same code as lab.sh init): if the file exists, it stays as it is.
# The list (only paths and descriptions, never a value) goes in via stdin,
# the output never shows a value.

- name: "Create secret files, only what is missing: {{ secret_names | join(', ') }}"
  ansible.builtin.command:
    argv: >-
      {{ [ansible_playbook_python, lab_secrets_script, 'generate', '--json', '-']
      + (secret_names | map('regex_replace', '^', '--name=') | list) }}
    stdin: "{{ secrets_all | to_json }}"
  register: secrets_generate_result
  changed_when: "'NEW: ' in secrets_generate_result.stdout"
  diff: false
