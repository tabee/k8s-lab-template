---
# Units changed: reload and restart the timers.
- name: Reload replica timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    state: restarted
    daemon_reload: true
  loop:
    - "{{ backup_replica_unit_prefix }}-mirror.timer"
    - "{{ backup_replica_unit_prefix }}-verify.timer"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  # In the --check run before the first installation the unit does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
