---
# Systemd user units of the mirror and of the checksum run.

- name: Units of the mirror and of the checksum run
  ansible.builtin.template:
    src: "replica-{{ item }}.j2"
    dest: "{{ backup_s3_systemd_user_dir }}/{{ backup_replica_unit_prefix }}-{{ item }}"
    mode: "0644"
  loop:
    - mirror.service
    - mirror.timer
    - verify.service
    - verify.timer
  notify: Reload replica timers

- name: Load the units now if they are new
  ansible.builtin.meta: flush_handlers

- name: Timers run and start at boot
  ansible.builtin.systemd_service:
    name: "{{ backup_replica_unit_prefix }}-{{ item }}.timer"
    scope: user
    enabled: true
    state: started
  loop:
    - mirror
    - verify
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  # In the --check run before the first installation the unit does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
