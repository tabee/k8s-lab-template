---
# Fetch kubeconfig, rewrite server to the VM address and all names to
# k3s_context_name, store locally with 0600.
# no_log/diff: false, because the file contains the client key.

- name: Read kubeconfig from the server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_remote
  no_log: true

- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write kubeconfig locally
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_local | to_nice_yaml(indent=2) }}"
    dest: "{{ k3s_kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  diff: false
  no_log: true
  vars:
    k3s_kc: "{{ k3s_kubeconfig_remote.content | b64decode | from_yaml }}"
    k3s_kubeconfig_local:
      apiVersion: v1
      kind: Config
      preferences: {}
      current-context: "{{ k3s_context_name }}"
      clusters:
        - name: "{{ k3s_context_name }}"
          cluster:
            certificate-authority-data: "{{ (k3s_kc.clusters | first).cluster['certificate-authority-data'] }}"
            server: "https://{{ k3s_api_endpoint }}:6443"
      users:
        - name: "{{ k3s_context_name }}"
          user: "{{ (k3s_kc.users | first).user }}"
      contexts:
        - name: "{{ k3s_context_name }}"
          context:
            cluster: "{{ k3s_context_name }}"
            user: "{{ k3s_context_name }}"
