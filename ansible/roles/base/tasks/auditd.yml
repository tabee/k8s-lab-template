---
# Auditd with base rules: changes to identity, sudo, sshd, firewall,
# k3s configuration and keys, time, kernel modules.
# No logging of all execve (too much noise from containers).

- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present
  register: base_auditd_install

- name: Check which audit paths exist
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ base_auditd_watches }}"
  loop_control:
    label: "{{ item.path }}"
  register: base_auditd_paths

- name: Write audit rules
  ansible.builtin.template:
    src: audit-baseline.rules.j2
    dest: /etc/audit/rules.d/50-lab-baseline.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load auditd rules

- name: Enable auditd
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
  # In check mode auditd is only "simulated" as installed on the first run.
  when: not (ansible_check_mode and base_auditd_install is changed)
