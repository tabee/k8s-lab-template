{{- if not (include "notes.sso" .) }}
---
# Password protection, only with auth: basic (with auth: sso Keycloak logs in, see
# oauth2-proxy.yaml): Traefik asks for user and password (HTTP Basic Auth)
# before a request reaches the pod. Without: 401. The secret (type
# kubernetes.io/basic-auth, plaintext password) is created by Ansible; Traefik
# computes the hash itself. removeHeader: the web server never sees the password.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  labels:
    {{- include "notes.labels" . | nindent 4 }}
  annotations:
    {{- include "notes.crdAnnotation" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ .Values.secrets.auth }}
    realm: {{ printf "Notes %s" .Values.site.name | quote }}
    removeHeader: true
{{- end }}
---
# As with docs: browsers re-ask for every page (otherwise up to 1 day old).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: no-cache
  labels:
    {{- include "notes.labels" . | nindent 4 }}
  annotations:
    {{- include "notes.crdAnnotation" . | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      Cache-Control: no-cache
