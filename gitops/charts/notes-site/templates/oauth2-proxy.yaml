{{- if include "notes.sso" . }}
---
# Single sign-on for the site (auth: sso): oauth2-proxy sits between Traefik and the
# notes pod (reverse proxy mode, upstream = Service notes). A request without a
# session is redirected to Keycloak (realm {{ .Values.sso.realm }}, confidential client
# "{{ .Values.sso.client }}", Authorization Code + PKCE); only members of the group
# "{{ .Values.sso.group }}" get in. Session = encrypted cookie (cookie session store): no
# database, no volume, nothing to back up (stateless). The notes pod is only reachable
# from this proxy (networkpolicy.yaml), not from Traefik directly.
# Endpoints: login in the browser = public Keycloak address; token, keys and
# user info = in-cluster Service (plain HTTP, port 8080), so the proxy needs no route
# to the internet and no trust in the lab CA. Secrets: client-secret and cookie-secret from
# the Secret {{ .Values.secrets.oidc }} (created by Ansible, never in Git).
# No --reverse-proxy: the X-Forwarded-* headers are not trusted (address and protocol are fixed by
# --redirect-url); the NetworkPolicy lets only Traefik in anyway.
# Logout: /oauth2/sign_out ends the session here and at Keycloak (back channel, id token hint).
# Meets PSA restricted. Runbook: docs/how-to/notes-sites.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-oauth2-proxy
  labels:
    {{- include "notes.proxyLabels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "notes.proxySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notes.proxyLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ .Values.images.proxy }}
          args:
            - --provider=oidc
            - --http-address=0.0.0.0:4180
            - --upstream=http://notes.{{ .Release.Namespace }}.svc:80
            - --proxy-prefix=/oauth2
            - --redirect-url={{ printf "https://%s/oauth2/callback" .Values.site.host }}
            - --client-id={{ .Values.sso.client }}
            # Issuer = public address (it is in the ID token); the endpoints are set by hand.
            - --oidc-issuer-url={{ printf "https://%s/realms/%s" .Values.sso.host .Values.sso.realm }}
            - --skip-oidc-discovery=true
            - --login-url={{ printf "https://%s/realms/%s/protocol/openid-connect/auth" .Values.sso.host .Values.sso.realm }}
            - --redeem-url={{ printf "%s/realms/%s/protocol/openid-connect/token" .Values.sso.keycloakUrl .Values.sso.realm }}
            - --oidc-jwks-url={{ printf "%s/realms/%s/protocol/openid-connect/certs" .Values.sso.keycloakUrl .Values.sso.realm }}
            - --backend-logout-url={{ printf "%s/realms/%s/protocol/openid-connect/logout?id_token_hint={id_token}" .Values.sso.keycloakUrl .Values.sso.realm }}
            - --scope=openid profile email groups
            - --code-challenge-method=S256
            # Authorization = group; the user name is the identity (no e-mail address needed).
            - --allowed-group={{ .Values.sso.group }}
            - --oidc-groups-claim=groups
            - --oidc-email-claim=preferred_username
            - --email-domain=*
            - --skip-provider-button=true
            - --cookie-name=_notes_{{ .Values.site.name }}
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire={{ .Values.sso.cookieExpire }}
            - --cookie-refresh={{ .Values.sso.cookieRefresh }}
            - --silence-ping-logging=true
            - --request-logging=false
            - --auth-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidc }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidc }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi  # lab-limit: notes-*/notes-oauth2-proxy/oauth2-proxy
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notes-oauth2-proxy
  labels:
    {{- include "notes.proxyLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "notes.proxySelector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
