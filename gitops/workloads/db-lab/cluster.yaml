---
# Practice database pg-lab: 3 instances (1 primary, 2 replicas, asynchronous
# streaming replication) on the single node k3s-lab. Protects against a crashed
# pod/process, not against a broken node: for that
# the backup in S3 is there (objectstore.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-lab
  namespace: db-lab
spec:
  instances: 3
  # PostgreSQL 18.6, minimal (without extensions), Debian trixie. Tag for
  # humans, digest for the machine (as of 2026-10-27).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  # No superuser secret: administration only via kubectl exec in the pod (socket).
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: app
      owner: app
      # No secret: CNPG creates pg-lab-app (user, password, URIs).
      # See docs/learning-path/stage-8b-cnpg.md, section "Entscheidungen".
  storage:
    size: 2Gi
    # Default StorageClass of k3s (local-path, a directory on the node).
  # One node: "preferred" spreads if there are more nodes, and does not block
  # if there are none. "required" would leave 2 of 3 pods hanging.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 192Mi  # lab-limit: db-lab/pg-lab/postgres
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  # WAL archive and base backups via the Barman cloud plugin.
  # serverName = subfolder in the bucket. On a disaster rebuild
  # (bootstrap.recovery) it must change (e.g. pg-lab-r2), because CNPG only writes into
  # an empty archive. Runbook: docs/learning-path/stage-8b-cnpg.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Default value of CNPG, set explicitly: otherwise CNPG adds it
      # in the cluster and Argo CD permanently sees OutOfSync.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-lab
        serverName: pg-lab
