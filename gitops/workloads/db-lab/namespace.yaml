---
# Namespace of the practice database. PSA restricted: the CNPG pods run
# without root (uid 26), without capabilities, seccomp RuntimeDefault.
# Delete=false: if the app db-lab is removed, the namespace stays and with
# it the S3 secret (app secrets-db-lab). Gone only by hand:
#   kubectl delete namespace db-lab
apiVersion: v1
kind: Namespace
metadata:
  name: db-lab
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # Before everything else in this app.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
