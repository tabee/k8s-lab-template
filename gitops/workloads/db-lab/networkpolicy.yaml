---
# Incoming in the namespace db-lab:
# - Default: nothing.
# - From db-lab itself: everything (replication 5432, pooler -> Postgres,
#   restore test of verify-cnpg.yml).
# - From cnpg-system (operator): 8000 (status of the instance) and 5432.
# Outgoing (wave 2, issue 5): first everything closed, then open selectively; see the
# egress policies at the end of the file (DNS, namespace, Postgres -> API and S3).
# Stage 8c: Gitea gets its own cluster in the namespace gitea, hence
# no permission for foreign namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: db-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: db-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: db-lab
spec:
  # All pods: also the throwaway cluster pg-lab-verify (verify-cnpg.yml)
  # and a rebuild with a different name need the operator.
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
          protocol: TCP
        - port: 5432
          protocol: TCP
---
# Egress (wave 2, issue #5): nothing leaves a pod unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: db-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# DNS: only the cluster DNS pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: db-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Inside the namespace: Gitea/Pooler -> Postgres, replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-same-namespace
  namespace: db-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
---
# Postgres instance, backup and initdb pods (label cnpg.io/cluster): API server (Cluster status,
# leader lease; rule is evaluated after DNAT, so node IP:6443) and S3 of the backup target
# (barman-cloud plugin: WAL archive, base backup, restore). Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cnpg-api-s3
  namespace: db-lab
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.122.50/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 192.168.122.1/32
      ports:
        - protocol: TCP
          port: 9000
---
# Pooler pods read their Pooler/Secret objects from the API server. No S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-pooler-api
  namespace: db-lab
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.122.50/32
      ports:
        - protocol: TCP
          port: 6443
