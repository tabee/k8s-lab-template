---
# Gitea to Keycloak (single sign-on), only for the OIDC back channel: the
# discovery document, token, keys and user info are fetched from the Service
# keycloak.keycloak.svc over plain HTTP on port 8080. Only this pod, only that
# target. The matching ingress rule is keycloak-allow-oidc-clients in
# gitops/workloads/keycloak/manifests/networkpolicy.yaml. A separate file, so
# the main policy of this namespace stays untouched.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-allow-egress-keycloak
  namespace: gitea
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8080
