---
# Incoming in the namespace matrix first everything closed, then open selectively:
#   - Pods in the same namespace among each other (Synapse -> pooler -> Postgres,
#     replication, backup pods of K8up),
#   - the CNPG operator to the instances (status 8000, Postgres 5432),
#   - Traefik to Synapse (port 8008) and Element Web (port 8080).
# Outgoing: first everything closed. Synapse and Element have no path to the
# internet: federation is off, URL preview is off, Element has no identity
# server. DNS and the same namespace are enough for them. Postgres and K8up
# may reach the API server and the S3 backup target, the pooler only the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-allow-traefik-synapse
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: synapse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-allow-traefik-element
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: element
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Egress: nothing leaves a pod unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# DNS: only the cluster DNS pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Inside the namespace: Synapse and the pooler to Postgres, replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-same-namespace
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
---
# Postgres instance, backup and initdb pods (label cnpg.io/cluster): API server
# (rule is evaluated after DNAT, so node IP:6443) and S3 of the backup target.
# Nothing else. Synapse does not carry this label and cannot use this path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cnpg-api-s3
  namespace: matrix
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.122.50/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 192.168.122.1/32
      ports:
        - protocol: TCP
          port: 9000
---
# Pooler pods read their Pooler/Secret objects from the API server. No S3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-pooler-api
  namespace: matrix
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.122.50/32
      ports:
        - protocol: TCP
          port: 6443
---
# K8up backup/restore job pods (label k8upjob): API server and S3. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-k8up
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      k8upjob: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.122.50/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 192.168.122.1/32
      ports:
        - protocol: TCP
          port: 9000
