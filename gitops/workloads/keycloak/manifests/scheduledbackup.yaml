---
# Daily base backup of keycloak-db. ONLY place for this time.
# Cron with seconds (6 fields), UTC: 20:20, five minutes after matrix-db
# (20:15) and 20:00 for gitea-db and pg-lab, so the base backups do not start
# together. Keycloak has no file volume, so there is no K8up schedule.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
  namespace: keycloak
spec:
  schedule: "0 20 20 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
