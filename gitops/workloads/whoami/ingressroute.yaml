---
# From outside via Traefik (entrypoint admin = port 8444, only from the admin networks,
# see values.yaml of Traefik; TLS with own certificate of the lab CA from
# certificate.yaml). whoami is the test application and not public. Test from the host:
#   curl --cacert ~/.config/k8s-lab/lab-ca.crt https://whoami.lab.example:8444/
# (entry in /etc/hosts: 192.168.122.50 whoami.lab.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: whoami
  annotations:
    # The CRD comes only from the app traefik. Until then the sync fails
    # and Argo CD tries again (retry in apps/whoami.yaml).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - admin
  routes:
    - kind: Rule
      match: Host(`whoami.lab.example`)
      services:
        # Same namespace (allowCrossNamespace is off).
        - name: whoami
          port: http
  # Secret created by cert-manager from certificate.yaml (same namespace).
  tls:
    secretName: whoami-tls
