---
# TLS certificate for whoami.lab.example from the lab CA (ClusterIssuer
# lab-ca). cert-manager creates the secret whoami-tls here in the namespace and
# renews it itself; the IngressRoute points to it via tls.secretName.
# ECDSA P-256 like the CA: small keys, fast handshakes, supported by all
# current clients. 90 days lifetime, renewal 30 days before.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: whoami
  namespace: whoami
  annotations:
    # The CRD comes from the app cert-manager. Until then the sync fails
    # and Argo CD tries again (retry in apps/whoami.yaml).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: whoami-tls
  dnsNames:
    - whoami.lab.example
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    # A new key on every renewal.
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
