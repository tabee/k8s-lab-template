---
# Stays ClusterIP. From outside only via Traefik (ingressroute.yaml).
# Test directly: kubectl -n whoami port-forward svc/whoami 8081:80
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
  labels:
    app.kubernetes.io/name: whoami
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
