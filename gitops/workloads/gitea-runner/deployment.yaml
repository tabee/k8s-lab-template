---
# The Gitea Actions runner (gitea/runner 5.4.1, the basic variant without Docker inside). One replica, capacity 1.
#
# Registration: Gitea creates the global runner token from the secret gitea-runner-token at start
# (GITEA_RUNNER_REGISTRATION_TOKEN, values-gitea.yaml); the same value is mounted here as a file
# (secret gitea-runner-registration, app secrets-gitea-runner). The token is read with --token-file, so it is in
# neither the environment nor the process list. The registration (.runner) lives on an emptyDir: a new pod
# registers again (one more offline entry under Site Administration > Actions > Runners, delete it there).
#
# The runner talks to Gitea over the Service (plain HTTP inside the cluster, never through Traefik) and to the
# API server with the token of its service account (rbac.yaml: job pods in gitea-runner-jobs only).
# No port is open: metrics, cache server and the pod network transfer are off (configmap.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
        app.kubernetes.io/part-of: gitea-runner
    spec:
      serviceAccountName: gitea-runner
      # The runner needs its token for the API server (job pods). Job pods never get one.
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: docker.io/gitea/runner:5.4.1@sha256:a19f8dd10e66398e77429806e4fe10587cc7e9bade450f069cf5ad525d8a2b5d
          imagePullPolicy: IfNotPresent
          command: ["/sbin/tini", "--", "/bin/bash", "-c"]
          args:
            - |
              set -eu
              cd /data
              if [ ! -s /data/.runner ]; then
                gitea-runner --config /etc/gitea-runner/config.yaml register --no-interactive \
                  --instance "${GITEA_INSTANCE_URL}" --token-file /run/secrets/gitea-runner/token \
                  --name "k8s-lab-${HOSTNAME}"
              fi
              exec gitea-runner --config /etc/gitea-runner/config.yaml daemon
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc:3000
            - name: HOME
              value: /data
            # Go returns memory to the limit early instead of being killed at it.
            - name: GOMEMLIMIT
              value: 48MiB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi  # lab-limit: gitea-runner/gitea-runner/runner
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/gitea-runner
              readOnly: true
            - name: registration
              mountPath: /run/secrets/gitea-runner
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: config
          configMap:
            name: gitea-runner-config
            # backup-window.sh is executed directly by the runner (health_check.script).
            defaultMode: 0555
        - name: registration
          secret:
            secretName: gitea-runner-registration
            defaultMode: 0440
