---
# Argo CD UI from outside via Traefik (entrypoint admin = port 8444, only from the
# admin networks, see values.yaml of Traefik and docs/concepts/network-edge.md; TLS with
# own certificate of the lab CA from certificate.yaml). Traefik terminates TLS and
# talks HTTP internally with argocd-server (server.insecure, set by
# Ansible in roles/argocd_bootstrap/templates/values.yaml.j2).
# UI and CLI run over the same route; the CLI needs --grpc-web:
#   argocd login argocd.lab.example:8444 --grpc-web
# Test vom Host:
#   curl --cacert ~/.config/k8s-lab/lab-ca.crt https://argocd.lab.example:8444/
# (entry in /etc/hosts: 192.168.122.50 argocd.lab.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    # The CRD comes only from the app traefik. Until then the sync fails
    # and Argo CD tries again (retry in apps/argocd-ingress.yaml).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - admin
  routes:
    - kind: Rule
      match: Host(`argocd.lab.example`)
      services:
        # Same namespace (allowCrossNamespace is off). Service from the
        # Argo CD chart; port http (80) points to container port 8080.
        - name: argocd-server
          port: http
  # Secret created by cert-manager from certificate.yaml (same namespace).
  tls:
    secretName: argocd-ingress-tls
