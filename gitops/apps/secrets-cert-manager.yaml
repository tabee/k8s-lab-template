---
# Child application of the root app (app of apps), stage 7: encrypted
# secrets for the namespace cert-manager from secrets/cert-manager
# (Kustomize + KSOPS, decrypted in the repo-server with the age key
# from the secret argocd/sops-age, which Ansible creates).
# Project platform, like the app cert-manager. repoURL, targetRevision and
# project must match ansible/inventory/group_vars/all/argocd.yml.
# Public copy of the repo: leave out this file and secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-cert-manager
  namespace: argocd
  # Deleting this file cleans up the app. The secrets themselves stay
  # (annotation Prune=false,Delete=false in every *.sops.yaml).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ssh://git@git.example.org/YOUR-NAME/k8s-lab-secrets.git
    targetRevision: main
    path: secrets/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Server-side apply: otherwise Argo CD also writes the whole secret (with values,
    # only base64) into the annotation last-applied-configuration,
    # which e.g. kubectl describe shows.
    syncOptions:
      - ServerSideApply=true
    # Namespace cert-manager is created by Ansible (role lab_ca); KSOPS needs
    # the age key. If one of them is briefly missing, try again.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
