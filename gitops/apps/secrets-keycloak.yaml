---
# Child application of the root app: encrypted secrets for the namespace
# keycloak. The repo server renders secrets/keycloak with Kustomize + KSOPS
# and decrypts with the age key.
# Content: backup-s3-creds (Barman), keycloak-db-owner, keycloak-admin,
# keycloak-oidc-clients and keycloak-notes-client (client secrets for the realm job). There is no K8up
# secret: Keycloak has no file volume.
# The namespace is created by the app keycloak; until it is there, retry.
# Public copy of the repo: leave out this file and secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: ssh://git@git.example.org/YOUR-NAME/k8s-lab-secrets.git
    targetRevision: main
    path: secrets/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
