---
# Child application of the root app: encrypted secrets for the namespace
# matrix. The repo server renders secrets/matrix with Kustomize + KSOPS
# and decrypts with the age key.
# Content: backup-s3-creds (Barman), matrix-db-owner, matrix-admin,
# matrix-registration, matrix-signing-key (optional), k8up-s3-creds,
# k8up-repo (restic, own prefix, same password as the other file backups).
# The namespace is created by the app matrix; until it is there, retry.
# Public copy of the repo: leave out this file and secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-matrix
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: ssh://git@git.example.org/YOUR-NAME/k8s-lab-secrets.git
    targetRevision: main
    path: secrets/matrix
  destination:
    server: https://kubernetes.default.svc
    namespace: matrix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
