---
# Child application of the root app: encrypted secrets for the namespace
# gitea (stage 8c). The repo server renders secrets/gitea with Kustomize +
# KSOPS and decrypts with the age key (stage 7).
# Content: backup-s3-creds (Barman, like db-lab), gitea-db-owner,
# gitea-admin, k8up-s3-creds (own S3 user), k8up-repo (restic).
# The namespace is created by the app gitea (namespace.yaml); until it is there,
# this app tries again via retry.
# Public copy of the repo: leave out this file and secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-gitea
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: ssh://git@git.example.org/YOUR-NAME/k8s-lab-secrets.git
    targetRevision: main
    path: secrets/gitea
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
