---
# Child application of the root app: encrypted secrets for the namespace
# db-lab (stage 8b). The repo server renders secrets/db-lab with Kustomize +
# KSOPS and decrypts with the age key (stage 7).
# Content: backup-s3-creds (S3 access for Barman, from stage 8a).
# The namespace is created by the app db-lab (namespace.yaml); until it is there,
# this app tries again via retry.
# Public copy of the repo: leave out this file and secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-db-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: ssh://git@git.example.org/YOUR-NAME/k8s-lab-secrets.git
    targetRevision: main
    path: secrets/db-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: db-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
