---
# Child application of the root app: encrypted secret for the namespace gitea-runner (issue #115).
# Content: gitea-runner-registration (the global runner registration token; Gitea gets the same value as
# gitea-runner-token through the app secrets-gitea). The namespace is created by the app gitea-runner
# (namespace.yaml); until it is there, this app tries again via retry.
# Public copy of the repo: leave out this file and secrets/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-gitea-runner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab
  source:
    repoURL: ssh://git@git.example.org/YOUR-NAME/k8s-lab-secrets.git
    targetRevision: main
    path: secrets/gitea-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
