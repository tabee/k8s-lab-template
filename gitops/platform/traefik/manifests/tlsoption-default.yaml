---
# Global TLS default for all routers (name "default" in the namespace traefik,
# see providers.kubernetesCRD.defaultTLSResourcesNamespace in values.yaml).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
  annotations:
    # CRD comes from the chart in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  minVersion: VersionTLS12
  # Only AEAD suites with forward secrecy for TLS 1.2 (TLS 1.3 chooses itself).
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  # sniStrict (from stage 6): only names with their own certificate (tls.secretName
  # of an IngressRoute) get a handshake. Unknown name, no SNI
  # or access via the IP -> rejected ("unrecognized name"). The
  # default certificate from the TLSStore does not count as a hit.
  sniStrict: true
