[project.theme]
variant = "modern"
language = "de"
# System fonts: no requests to Google Fonts.
font = false
features = [
  "navigation.instant",
  "navigation.top",
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
]

[[project.theme.palette]]
scheme = "slate"
primary = "deep-purple"
accent = "pink"

[project.plugins.search]

# Python-Markdown extensions. Mermaid: the fence "mermaid" becomes
# <pre class="mermaid">; the theme loads mermaid@11 from a CDN at view time
# (ADR-0010). Abbreviations: docs/_includes/abbreviations.md is appended to
# every page by the snippets extension (tooltips via content.tooltips).
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets = { base_path = ["docs"], auto_append = ["_includes/abbreviations.md"] }
pymdownx.superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
pymdownx.tabbed = { alternate_style = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}

