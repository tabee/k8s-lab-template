# Zensical configuration of the docs site (address: site_url).
# Lives in the repo root because Zensical only accepts a docs_dir below this
# folder. Content: docs/ (Diataxis: tutorials, how-to, reference, concepts,
# learning path). gitops/README.md joins through the symlink
# docs/reference/gitops-layout.md, no copies in Git.
# Local build: bash docs/build.sh /workspace/docs-site   (guide:
# docs/how-to/docs-site.md). Tested with Zensical 0.0.72 (docs/requirements.txt).

[project]
site_name = "k8s-lab Doku"
site_description = "Handbuch zum k3s-Lab: Tutorials, Anleitungen, Referenz, Konzepte"
# Public address: needed for navigation.instant (sitemap) and canonical links.
# verify-docs.yml checks that it matches the ingress.
site_url = "https://docs.lab.example/"
# Source repository: the "edit" button on every page and the repository link
# point here (feature content.action.edit). The only place of these two values;
# the public export replaces them (scripts/public/export.conf). Gitea: _edit/,
# GitHub: edit/. The path is relative to the repo root, docs_dir is docs/.
repo_url = "https://github.com/tabee/k8s-lab-template"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
# Lives in docs/ but does not belong on the site. "_includes" holds the
# abbreviation list that the snippets extension appends to every page.
exclude_docs = """
_includes
build.sh
requirements.txt
vendor-mermaid.py
"""
# Output in the repo root (listed in .gitignore); build.sh copies it to the target.
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/neon.css"]
# Menu, in this order. New page in docs/: add it here (otherwise it is only
# reachable by link). A folder with an index.md becomes a section whose first
# entry is that index (navigation.indexes).
