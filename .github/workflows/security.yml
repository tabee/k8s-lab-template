---
# Security and privacy checks (docs: docs/concepts/public-release-security.md, docs/how-to/security-scan.md).
# All rules live in scripts/security-scan.sh (gitleaks, trufflehog, personal-data rules, trivy, kubeconform,
# actionlint, zizmor, yamllint, shellcheck, public tree check, commit identity). This file only provides the tools
# and the repository. The tool versions and SHA-256 checksums are in ci/security-tools.env, the Python tools in
# ci/requirements-security.txt (installed with --require-hashes). Nothing is downloaded unpinned.
#
# Same file on Gitea Actions and GitHub Actions (the export moves it to .github/workflows/): no third-party
# actions at all (nothing to pin, no supply chain), a container image pinned by digest (the same python image as
# egress_probe_image, tests/pins-tests.sh ties them together), the token only with contents: read.
#
# Optional secret PII_DENYLIST (same format as the private deny list, one "name<TAB>regex" per line): adds the
# operator's own names, domains and addresses to the personal-data scan (anonymous rule ids, redacted output).
# Without it only the generic rules run and the summary says so.
name: security
"on":
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # New vulnerabilities appear without a commit: once a week the same checks run again.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push replaces the run of the same branch (never the scheduled run of the default branch).
  group: security-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # act_runner would take "sh -e" otherwise; the image ships bash.
    shell: bash

jobs:
  security:
    name: security and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: docker.io/library/python:3.13.17-trixie@sha256:d5a186865324088bd10d1671801b42297a8fe3f8059143fb22b2e2b776ffa6dd
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      # No actions/checkout: the image has no Node.js. Full history, because the secret and identity checks read it.
      - name: Fetch the repository with full history
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          auth=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          git init --quiet .
          git remote add origin "$REPO_URL"
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          echo "Commits in the history: $(git rev-list --count HEAD)"

      - name: Install the scanners (pinned, checksums verified)
        run: |
          set -eu
          bash scripts/install-security-tools.sh "$RUNNER_TEMP/bin"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r ci/requirements-security.txt
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Contributors may have a personal address in their commits: only what a push or pull request ADDS is checked,
      # so an old commit cannot make every later run red.
      - name: Commits to check for the identity rule
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          range=HEAD
          if [ "$EVENT" = pull_request ] && [ -n "$BASE_SHA" ]; then
            git fetch --quiet origin "$BASE_SHA" && range="$BASE_SHA..HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA#0000000}" = "$BEFORE_SHA" ]; then
            git cat-file -e "$BEFORE_SHA" 2> /dev/null && range="$BEFORE_SHA..HEAD"
          fi
          echo "IDENTITY_RANGE=$range" >> "$GITHUB_ENV"
          echo "identity range: $range"

      - name: Security and privacy checks (a missing tool is red here)
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: bash scripts/security-scan.sh --strict
